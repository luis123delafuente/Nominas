<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Subir nóminas - MEDIFORM PLUS</title>
</head>
<body>
  <h1>Subir PDF mensual de nóminas</h1>

  <p><a href="/empleados">Gestión de empleados</a></p>

  {% if error %}
    <p style="color:red"><strong>Error:</strong> {{ error }}</p>
  {% endif %}

  <form action="/subir" method="post" enctype="multipart/form-data">
    <p>
      <label for="empresa_id">Empresa:</label>
      <select id="empresa_id" name="empresa_id" required>
        {% for empresa in empresas %}
          <option value="{{ empresa.id }}" {% if empresa.id == empresa_id_seleccionada %}selected{% endif %}>{{ empresa.nombre }}</option>
        {% endfor %}
      </select>
    </p>
    <p>
      <input type="file" id="pdf" name="pdf" accept="application/pdf" required>
    </p>
    <p>
      <small>El mes de la nómina se detecta solo a partir del contenido del PDF — podrás corregirlo en la pantalla siguiente si hace falta.</small>
    </p>
    <button type="submit">Subir y analizar</button>
  </form>
</body>
</html>
